# ──────────────────────────────────────────────────────────────
# BitFox Single-Bot Compose — deploy exactly one bot instance
# Use this instead of docker-compose.yml when you only need one.
#
# Override with an .env file or set vars in Portainer UI.
#
# Portainer: Add Stack → paste this → set the 4 required vars.
# ──────────────────────────────────────────────────────────────

services:
  bitfox-bot:
    build: .
    container_name: bitfox-bot
    restart: unless-stopped
    environment:
      - STRATEGY=${STRATEGY:-Phoenix}
      - SYMBOL=${SYMBOL:-ADAUSDT}
      - TIMEFRAME=${TIMEFRAME:-1h}
      - AMOUNT=${AMOUNT:-50}
      - BYBIT_API_KEY=${BYBIT_API_KEY:?Set BYBIT_API_KEY}
      - BYBIT_API_SECRET=${BYBIT_API_SECRET:?Set BYBIT_API_SECRET}
      - NOTIFICATION_TYPE=${NOTIFICATION_TYPE:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
    volumes:
      - bot-logs:/app/logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  bot-logs:
